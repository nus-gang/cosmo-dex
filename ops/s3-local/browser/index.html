<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S3 로컬 개발</title></head>
<body>
<h1>S3 로컬 개발 준비</h1>
<p>합성 자산 전용 · durable_ack=false · G00=FAIL_UNPROVEN / allowlist=[] / ACK=CLOSED</p>
<p>새 키는 이 탭에서만 유지됩니다. 새로고침하거나 닫으면 복구할 수 없습니다.</p>
<label><input id="enabled" type="checkbox">로컬 개발 프로필 사용</label>
<label><input id="acknowledge" type="checkbox">저장 공간·내구성 보장이 입증되지 않았음을 확인</label>
<button id="prepare" type="button">새 시험 계정 2개 준비</button>
<pre id="registration" aria-label="공개 등록 데이터"></pre>
<button id="activate" type="button" disabled>초기화 후 화면 연결</button>
<p id="status" role="status">기본 비활성 · 아직 키나 요청이 생성되지 않았습니다.</p>
<main id="wallet"></main>
<script type="module" src="/page.js"></script>
</body></html>
