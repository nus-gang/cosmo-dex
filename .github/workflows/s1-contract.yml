name: S1 contract fixtures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version: '1.24.4'
          cache: false
      - name: Synthetic fixture checks, not S1 app execution
        run: |
          python3 protocol/s1/tools/check.py
          cd chain
          GOTOOLCHAIN=local go run -mod=readonly ../protocol/s1/tools/sign-vectors.go
