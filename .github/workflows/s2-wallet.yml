name: S2 Wallet
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7ce952475b4985096344d713467208722b5e7693
          path: .deps/s2-chain
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: chain/app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Build pinned components
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build --locked --manifest-path exchange/Cargo.toml --bin exchange-s2
          (cd .deps/s2-chain/chain/app && sh scripts/build.sh)
          (cd web && npm ci --ignore-scripts && npx playwright-core install --with-deps chromium)
      - name: Wallet unit and regression checks
        run: |
          python3 ops/ci/build_manifest.py --check
          cd web
          ./node_modules/.bin/tsc --noEmit -p s2/tsconfig.json
          node --experimental-strip-types --test s2/*.test.ts
          node s2/build.mjs
          npm test
          node --experimental-strip-types --test s1/direct.test.ts
      - name: Actual API product browser acceptance
        run: |
          mkdir -p .evidence/wallet-scratch
          S2_TEST_CHAIN="$PWD/.deps/s2-chain/chain/app/bin/nusd" S2_ENGINE_BINARY="$PWD/exchange/target/debug/exchange-s2" S2_TEST_SCRATCH="$PWD/.evidence/wallet-scratch" node web/s2/browser.test.mjs .evidence/wallet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-wallet-${{ github.sha }}
          path: .evidence/wallet/
          include-hidden-files: true
