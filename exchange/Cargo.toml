[package]
name = "nus-exchange-contract"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# Only the subprocess fault harness enables this. Normal binaries do not read
# fault environment variables or include injected storage errors.
fault-injection = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
num-bigint = "0.4"
num-traits = "0.2"
bech32 = "0.9"

orderbook-rs = { version = "=0.13.1", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
# Only the deterministic fork/exec lock-lifetime regression uses raw syscalls.
libc = "0.2"
